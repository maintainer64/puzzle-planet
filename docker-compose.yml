name: puzzle-planet
services:
  app:
    image: ghcr.io/maintainer64/puzzle-planet:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/puzzle-planet.sqlite
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    volumes:
      - puzzle-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
volumes:
  puzzle-data:
